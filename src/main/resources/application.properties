spring.application.name=StockFlow
spring.datasource.url=jdbc:h2:file:./data/stockflow;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.address=127.0.0.1
server.port=8080
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
stockflow.demo.enabled=true
stockflow.admin.password=${STOCKFLOW_ADMIN_PASSWORD:}
stockflow.staff.password=${STOCKFLOW_STAFF_PASSWORD:}
